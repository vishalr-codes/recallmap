spring:
  application:
    name: recallmap
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recallmap}
    username: ${DB_USERNAME:recallmap}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: ${OPENAPI_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsA32ByteLocalDevJWTSecretKey!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  error:
    include-message: never
    include-stacktrace: never
